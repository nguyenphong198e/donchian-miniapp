name: Donchian H4 Paper

on:
  # Hourly updates now run from the bot machine (scripts/update_paper.bat): GitHub's hourly cron never fired reliably.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: donchian-paper-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas requests

      - name: Run paper engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBAPP_URL: ${{ vars.WEBAPP_URL }}
          RISK_PCT: ${{ vars.RISK_PCT || '2' }}
          VOL_MULT: ${{ vars.VOL_MULT || '1.5' }}
          PAPER_START: ${{ vars.PAPER_START || '2026-01-01' }}
        run: python engine/donchian_paper.py

      - name: Commit dashboard.json
        run: |
          git config user.name "donchian-paper-bot"
          git config user.email "donchian-paper-bot@users.noreply.github.com"
          git add docs/data/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(paper): update dashboard.json"
            git push
          fi
