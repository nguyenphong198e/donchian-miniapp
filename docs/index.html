<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Donchian H4 · Paper</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #14171c; --ink-2: #4b5563; --ink-3: #8b93a1; --line: #e5e7eb;
    --accent: #2f6fde; --pos: #128a4c; --neg: #c8372d; --pos-bg: #e6f5ec; --neg-bg: #fbe9e7; --warn: #b26a00;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b21; --ink: #eef0f3; --ink-2: #b4bac4; --ink-3: #7c8492; --line: #262a32;
      --accent: #5b93f0; --pos: #3cc37a; --neg: #ff6b5e; --pos-bg: #133222; --neg-bg: #3a1a17; --warn: #e0a440; }
  }
  html.tg { --bg: var(--tg-theme-secondary-bg-color, #f4f5f7); --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #fff));
    --ink: var(--tg-theme-text-color, #14171c); --ink-2: var(--tg-theme-subtitle-text-color, #4b5563);
    --ink-3: var(--tg-theme-hint-color, #8b93a1); --accent: var(--tg-theme-button-color, #2f6fde); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  .card { background: var(--card); border-radius: var(--radius); padding: 14px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 2px 4px; }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--line); color: var(--ink-2); vertical-align: 2px; margin-left: 4px; }
  .upd { font-size: 12px; color: var(--ink-3); text-align: right; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-right: 5px; vertical-align: 1px; }
  .dot.on { background: var(--pos); }
  .hero .lbl { font-size: 12.5px; color: var(--ink-3); }
  .hero .eq { font-size: 32px; font-weight: 800; letter-spacing: -.5px; margin: 2px 0 0; }
  .hero .chg { font-size: 14px; font-weight: 700; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .kpi { background: var(--bg); border-radius: 10px; padding: 8px; }
  .kpi span { display: block; font-size: 10.5px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
  .kpi b { display: block; font-size: 15px; margin-top: 2px; }
  .chart { position: relative; margin-top: 12px; }
  .chart svg { display: block; width: 100%; height: 170px; touch-action: pan-y; }
  .chart svg text { fill: var(--ink-3); font-size: 10.5px; }
  .tip { position: absolute; top: 0; pointer-events: none; background: var(--ink); color: var(--card); font-size: 12px; padding: 5px 8px; border-radius: 8px; white-space: nowrap; transform: translateX(-50%); }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-radius: 12px; padding: 4px; gap: 4px; position: sticky; top: 6px; z-index: 5; }
  .tabs button { border: 0; background: transparent; color: var(--ink-2); font: inherit; font-weight: 600; font-size: 14px; padding: 8px 4px; border-radius: 9px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: var(--tg-theme-button-text-color, #fff); }
  .tabs .n { font-size: 11px; opacity: .8; margin-left: 3px; }
  .list { display: grid; gap: 10px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .sym { font-weight: 700; font-size: 16px; }
  .sub { font-size: 12.5px; color: var(--ink-3); }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; margin-top: 10px; }
  .grid3 span { display: block; font-size: 11px; color: var(--ink-3); }
  .grid3 b { font-size: 14px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 10px; position: relative; overflow: hidden; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
  .chip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .chip.pos { background: var(--pos-bg); } .chip.neg { background: var(--neg-bg); }
  .empty { text-align: center; color: var(--ink-3); padding: 22px 10px; font-size: 14px; }
  .radar { display: grid; grid-template-columns: 1fr 74px auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .radar:first-child { border-top: 0; padding-top: 0; }
  .radar svg { width: 74px; height: 26px; display: block; }
  .gap { text-align: right; min-width: 92px; }
  .gap b { display: block; font-size: 15px; }
  .hist { padding: 10px 0; border-top: 1px solid var(--line); }
  .hist:first-child { border-top: 0; padding-top: 0; }
  .tag { font-size: 10.5px; font-weight: 700; color: var(--ink-3); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; margin-left: 4px; }
  .note { font-size: 12px; color: var(--ink-3); line-height: 1.5; }
  .note b { color: var(--ink-2); }
  .err { background: var(--neg-bg); color: var(--neg); border-radius: 10px; padding: 10px; font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Donchian H4 <span class="badge">PAPER</span></h1>
    <div class="upd"><span class="dot" id="liveDot"></span><span id="upd">Đang tải…</span></div>
  </header>
  <div class="err" id="err" hidden></div>

  <section class="card hero">
    <div class="lbl" id="heroLbl">Vốn mô phỏng</div>
    <div class="eq num" id="eq">–</div>
    <div class="chg num" id="chg"></div>
    <div class="kpis">
      <div class="kpi"><span>Max DD</span><b class="num" id="kDd">–</b></div>
      <div class="kpi"><span>Thắng</span><b class="num" id="kWr">–</b></div>
      <div class="kpi"><span>PF</span><b class="num" id="kPf">–</b></div>
      <div class="kpi"><span>Tổng R</span><b class="num" id="kR">–</b></div>
    </div>
    <div class="chart" id="chartBox"><svg id="chart" role="img" aria-label="Đường vốn mô phỏng"></svg><div class="tip" id="tip" hidden></div></div>
    <div class="sub" id="ddNow" style="margin-top:6px"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="open">Vị thế<span class="n" id="nOpen"></span></button>
    <button role="tab" aria-selected="false" data-tab="radar">Radar</button>
    <button role="tab" aria-selected="false" data-tab="hist">Lịch sử<span class="n" id="nHist"></span></button>
  </nav>

  <section id="tab-open" class="list"></section>
  <section id="tab-radar" class="card" hidden></section>
  <section id="tab-hist" class="card" hidden></section>

  <section class="card note" id="rules"></section>
</div>
<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg && tg.initData !== undefined && tg.platform !== "unknown") {
  document.documentElement.classList.add("tg");
  tg.ready(); tg.expand();
}
let D = null, live = {}, tab = "open";
const $ = id => document.getElementById(id);
const usd = (v, d = 0) => (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const sgnUsd = v => (v >= 0 ? "+" : "") + usd(v);
const pct = (v, d = 1) => (v > 0 ? "+" : "") + v.toFixed(d) + "%";
const px = v => v >= 100 ? v.toLocaleString("en-US", { maximumFractionDigits: 2 }) : v >= 1 ? v.toFixed(4) : v.toFixed(6);
const coin = s => s.replace(/USDT$/, "");
const cls = v => v >= 0 ? "pos" : "neg";
const parseT = s => Date.parse(s.replace(" ", "T") + ":00Z");
const fmtD = s => { const d = new Date(parseT(s)); return `${String(d.getUTCDate()).padStart(2, "0")}/${String(d.getUTCMonth() + 1).padStart(2, "0")}`; };
const ago = s => { const m = Math.round((Date.now() - parseT(s)) / 60000); return m < 1 ? "vừa xong" : m < 60 ? `${m} phút trước` : m < 1440 ? `${Math.round(m / 60)} giờ trước` : `${Math.round(m / 1440)} ngày trước`; };
const why = { sl: "SL ban đầu", trail: "Trailing", time: "Hết 30 ngày" };
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };

function openPnl(t) {
  const p = live[t.symbol] || t.last || t.entry;
  const upnl = t.notional * (p / t.entry - 1) - t.notional * D.meta.fee_pct / 100 - (t.funding || 0);
  return { p, upnl, r: (p - t.entry) / (t.entry - t.sl0) };
}

function renderHero() {
  const s = D.stats, m = D.meta;
  let eq = s.equity;
  if (live && D.open.length) eq = D.open.reduce((a, t) => a - (t.upnl || 0) + openPnl(t).upnl, s.equity);
  $("eq").textContent = usd(eq);
  const r = (eq / m.equity0 - 1) * 100;
  $("chg").innerHTML = `<span class="${cls(r)}">${pct(r)}</span> <span class="sub">từ ${usd(m.equity0)} · bắt đầu ${fmtD(m.paper_start + " 00:00")}/${m.paper_start.slice(0, 4)}</span>`;
  $("kDd").textContent = s.max_dd_pct.toFixed(1) + "%";
  $("kWr").textContent = s.winrate == null ? "–" : s.winrate.toFixed(0) + "%";
  $("kPf").textContent = s.pf == null ? "–" : s.pf.toFixed(2);
  $("kR").textContent = (s.sum_r >= 0 ? "+" : "") + s.sum_r.toFixed(1) + "R";
  $("ddNow").textContent = `Đang cách đỉnh vốn ${s.cur_dd_pct.toFixed(1)}% (đỉnh ${usd(s.peak)}) · ${s.trades} lệnh đã đóng · phí ${usd(s.fees)} · funding ${usd(s.funding)}`;
}

function drawChart() {
  const svg = $("chart"), box = $("chartBox"), tip = $("tip");
  svg.replaceChildren(); tip.hidden = true;
  const W = Math.max(280, box.clientWidth), H = 170, m = { l: 44, r: 6, t: 8, b: 20 };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const pts = D.curve.map(([t, v]) => [parseT(t), v]);
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  let lo = Math.min(...pts.map(p => p[1]), D.meta.equity0), hi = Math.max(...pts.map(p => p[1]));
  const pad = (hi - lo) * 0.08 || 100; lo -= pad; hi += pad;
  const X = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r), Y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const step = [500, 1000, 2000, 2500, 5000, 10000, 20000].find(s => (hi - lo) / s <= 5) || 50000;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    el("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "var(--line)", "stroke-dasharray": v === D.meta.equity0 ? "3 3" : "" }, svg);
    el("text", { x: m.l - 6, y: Y(v) + 3.5, "text-anchor": "end" }, svg).textContent = "$" + (v / 1000).toFixed(v % 1000 ? 1 : 0) + "k";
  }
  const d0 = new Date(t0);
  for (let d = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth() + 1, 1)); d.getTime() < t1; d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 2, 1))) {
    const x = X(d.getTime()); if (x < m.l + 10 || x > W - m.r - 14) continue;
    el("text", { x, y: H - 5, "text-anchor": "middle" }, svg).textContent = `T${d.getUTCMonth() + 1}`;
  }
  const line = pts.map(([t, v], i) => (i ? "L" : "M") + X(t).toFixed(1) + "," + Y(v).toFixed(1)).join("");
  el("path", { d: line + `L${X(t1)},${H - m.b}L${X(t0)},${H - m.b}Z`, fill: "var(--accent)", opacity: .08 }, svg);
  el("path", { d: line, fill: "none", stroke: "var(--accent)", "stroke-width": 2, "stroke-linejoin": "round" }, svg);
  const [lt, lv] = pts[pts.length - 1];
  el("circle", { cx: X(lt), cy: Y(lv), r: 4, fill: "var(--accent)", stroke: "var(--card)", "stroke-width": 2 }, svg);
  const cross = el("line", { y1: m.t, y2: H - m.b, stroke: "var(--ink-3)", visibility: "hidden" }, svg);
  const dotH = el("circle", { r: 4, fill: "var(--accent)", stroke: "var(--card)", "stroke-width": 2, visibility: "hidden" }, svg);
  const hit = el("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent" }, svg);
  const move = e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * W / r.width;
    const t = t0 + (Math.min(Math.max(sx, m.l), W - m.r) - m.l) / (W - m.l - m.r) * (t1 - t0);
    let a = 0, b = pts.length - 1; while (a < b) { const c = (a + b + 1) >> 1; if (pts[c][0] <= t) a = c; else b = c - 1; }
    const [pt, pv] = pts[a], x = X(pt);
    for (const n of [cross]) { n.setAttribute("x1", x); n.setAttribute("x2", x); n.setAttribute("visibility", "visible"); }
    dotH.setAttribute("cx", x); dotH.setAttribute("cy", Y(pv)); dotH.setAttribute("visibility", "visible");
    const d = new Date(pt);
    tip.textContent = `${String(d.getUTCDate()).padStart(2, "0")}/${String(d.getUTCMonth() + 1).padStart(2, "0")} · ${usd(pv)} (${pct((pv / D.meta.equity0 - 1) * 100)})`;
    tip.hidden = false;
    const px_ = x / W * box.clientWidth, half = tip.offsetWidth / 2;
    tip.style.left = Math.min(Math.max(px_, half), box.clientWidth - half) + "px";
    tip.style.top = "-26px";
  };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); dotH.setAttribute("visibility", "hidden"); });
}

function renderOpen() {
  const box = $("tab-open"); box.replaceChildren();
  $("nOpen").textContent = D.open.length ? D.open.length : "";
  if (!D.open.length) {
    const c = document.createElement("div"); c.className = "card empty";
    const near = D.radar.filter(r => !r.in_position).sort((a, b) => a.gap_pct - b.gap_pct)[0];
    c.innerHTML = `Chưa có vị thế mở.<br>Bot đang chờ một coin đóng nến H4 vượt đỉnh ${D.meta.lookback} nến.` +
      (near ? `<br><br>Gần nhất: <b>${coin(near.symbol)}</b>, cần tăng thêm <b class="num">${liveGap(near).toFixed(1)}%</b>.` : "");
    box.appendChild(c); return;
  }
  for (const t of D.open) {
    const { p, upnl, r } = openPnl(t);
    const toStop = (t.stop / p - 1) * 100;
    const span = t.extreme - t.sl0, prog = span > 0 ? Math.min(Math.max((p - t.sl0) / span, 0), 1) : 0;
    const c = document.createElement("div"); c.className = "card";
    c.innerHTML = `
      <div class="row"><div><span class="sym">${coin(t.symbol)}</span> <span class="sub">LONG · ${t.bars}/180 nến H4</span></div>
        <span class="chip ${cls(r)} num">${r >= 0 ? "+" : ""}${r.toFixed(2)}R</span></div>
      <div class="row" style="margin-top:4px"><span class="sub">Vào ${fmtD(t.entry_time)} @ <span class="num">${px(t.entry)}</span></span>
        <b class="num ${cls(upnl)}">${sgnUsd(upnl)}</b></div>
      <div class="grid3">
        <div><span>Giá hiện tại</span><b class="num">${px(p)}</b></div>
        <div><span>Stop (trailing)</span><b class="num">${px(t.stop)}</b></div>
        <div><span>Cách stop</span><b class="num ${toStop > -3 ? "neg" : ""}">${toStop.toFixed(1)}%</b></div>
        <div><span>Đỉnh từ lúc vào</span><b class="num">${px(t.extreme)}</b></div>
        <div><span>SL ban đầu</span><b class="num">${px(t.sl0)}</b></div>
        <div><span>Notional</span><b class="num">${usd(t.notional)}</b></div>
      </div>
      <div class="bar" title="Giá nằm ở đâu giữa SL ban đầu và đỉnh"><i style="width:${(prog * 100).toFixed(0)}%"></i></div>
      <div class="sub" style="margin-top:4px">Vị trí giá giữa SL ban đầu và đỉnh: ${(prog * 100).toFixed(0)}%</div>`;
    box.appendChild(c);
  }
}

function liveGap(r) { const p = live[r.symbol] || r.price; return (r.ceiling / p - 1) * 100; }

function spark(svg, arr) {
  const lo = Math.min(...arr), hi = Math.max(...arr), W = 74, H = 26;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  el("path", { d: arr.map((v, i) => (i ? "L" : "M") + (i / (arr.length - 1) * W).toFixed(1) + "," + (2 + (1 - (v - lo) / (hi - lo || 1)) * (H - 4)).toFixed(1)).join(""),
    fill: "none", stroke: "var(--ink-3)", "stroke-width": 1.5 }, svg);
}

function renderRadar() {
  const box = $("tab-radar"); box.replaceChildren();
  const rows = [...D.radar].sort((a, b) => (b.in_position - a.in_position) || (liveGap(a) - liveGap(b)));
  for (const r of rows) {
    const g = liveGap(r), d = document.createElement("div"); d.className = "radar";
    const state = r.in_position ? `<b class="pos">Đang giữ lệnh</b><span class="sub">bỏ qua tín hiệu</span>`
      : g <= 0 ? `<b class="pos">Đã vượt đỉnh</b><span class="sub">chờ nến H4 đóng</span>`
      : `<b class="num">+${g.toFixed(1)}%</b><span class="sub">tới đỉnh ${D.meta.lookback} nến</span>`;
    d.innerHTML = `<div><div class="sym">${coin(r.symbol)}</div><div class="sub num">${px(live[r.symbol] || r.price)} · ATR ${r.atr_pct.toFixed(1)}%</div></div><svg aria-hidden="true"></svg><div class="gap">${state}</div>`;
    spark(d.querySelector("svg"), r.spark);
    box.appendChild(d);
  }
  const n = document.createElement("div"); n.className = "note"; n.style.marginTop = "8px";
  n.textContent = `Đường nhỏ là giá đóng 60 nến H4 gần nhất (10 ngày). Phần trăm là mức giá cần tăng để vượt đỉnh ${D.meta.lookback} nến H4; tín hiệu chỉ tính khi nến H4 đóng cửa trên mức đó.`;
  box.appendChild(n);
}

function renderHist() {
  const box = $("tab-hist"); box.replaceChildren();
  $("nHist").textContent = D.closed.length || "";
  if (!D.closed.length) { box.innerHTML = `<div class="empty">Chưa có lệnh đóng.</div>`; return; }
  for (const t of D.closed) {
    const d = document.createElement("div"); d.className = "hist";
    d.innerHTML = `<div class="row"><div><span class="sym">${coin(t.symbol)}</span>${t.backfill ? `<span class="tag" title="Lệnh trước ngày bật bot, tính lại từ dữ liệu quá khứ">QUÁ KHỨ</span>` : ""}</div>
      <span class="chip ${cls(t.pnl)} num">${t.r >= 0 ? "+" : ""}${t.r.toFixed(2)}R · ${sgnUsd(t.pnl)}</span></div>
      <div class="sub num">${fmtD(t.entry_time)} → ${fmtD(t.exit_time)} · ${px(t.entry)} → ${px(t.exit_px)} · ${why[t.reason] || t.reason}</div>`;
    box.appendChild(d);
  }
}

function renderRules() {
  const m = D.meta;
  $("rules").innerHTML = `<b>Luật (giống bot máy 1):</b> chỉ LONG, khung H4, ${m.symbols.length} coin (${m.symbols.map(coin).join(", ")}). Vào khi nến H4 đóng vượt đỉnh ${m.lookback} nến trước.
    SL ${m.trail_atr}×ATR, kéo lên theo đỉnh, giữ tối đa 30 ngày. Rủi ro ${m.risk_pct}% vốn mỗi lệnh, lãi kép, tổng vị thế tối đa ${m.cap}× vốn. Phí ${(+m.fee_pct).toFixed(2)}%/chiều và funding thật.<br><br>
    <b>Đây là mô phỏng, không phải tài khoản thật.</b> Lệnh có nhãn QUÁ KHỨ được tính lại từ dữ liệu trước ngày bật bot (${m.deployed_at.slice(0, 10)}). Giá thoát là mức stop; vào lệnh thật có trượt giá.`;
}

function renderAll() { renderHero(); drawChart(); renderOpen(); renderRadar(); renderHist(); renderRules(); }

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  for (const k of ["open", "radar", "hist"]) $("tab-" + k).hidden = k !== tab;
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
}));

async function load() {
  try {
    const r = await fetch(`data/dashboard.json?t=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    D = await r.json();
    $("err").hidden = true;
    $("upd").textContent = "Cập nhật " + ago(D.meta.updated);
    renderAll();
  } catch (e) {
    $("err").hidden = false; $("err").textContent = "Không tải được dữ liệu (" + e.message + "). Thử lại sau ít phút.";
  }
}

async function tick() {
  if (!D || document.hidden) return;
  try {
    const r = await fetch("https://fapi.binance.com/fapi/v1/ticker/price", { cache: "no-store" });
    const arr = await r.json(), want = new Set(D.meta.symbols);
    for (const x of arr) if (want.has(x.symbol)) live[x.symbol] = +x.price;
    $("liveDot").classList.add("on");
    renderHero(); if (tab === "open") renderOpen(); if (tab === "radar") renderRadar();
  } catch (e) { $("liveDot").classList.remove("on"); }
}

let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => D && drawChart(), 120); });
load().then(tick);
setInterval(tick, 5000);
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
